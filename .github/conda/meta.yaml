{% set version = environ.get('VERSION_NUMBER', '1.5.0') %}
{% set build = environ.get('BUILD_NUMBER', "0") %}

package:
  name: clingo-dl
  version: {{ version }}

source:
  path: ../..

requirements:
  build:
  - cmake
  - ninja
  - {{ compiler('c') }}
  - {{ compiler('cxx') }}
  host:
  - pytest
  - python
  - clingo>=6
  run:
  - python
  - {{ pin_compatible('clingo', max_pin='x.x') }}

build:
  number: {{ build }}

test:
  commands:
  - clingo-dl --version
  - python -c 'import clingodl'

about:
  home: https://potassco.org/
  license: MIT
  summary: A solver for logic programs with difference constraints.
  description: The clingo-dl solver extends the clingo ASP system with support for difference logic constraints.
  license_file: LICENSE.md
  doc_url: https://potassco.org/
  dev_url: https://github.com/potassco/clingo-dl
