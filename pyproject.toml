[build-system]
requires = ["clingo>=5.8,<5.9", "scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "clingo-dl"
dynamic = ["version"]
description = "CFFI-based bindings to the clingo-dl solver."
readme = { text = """
This package allows for adding the clingo-dl propagator as a
theory in clingo.

It can also be used as a clingo-dl solver running:

    python -m clingodl ARGUMENTS
""", content-type = "text/markdown" }
authors = [{ name = "Roland Kaminski", email = "kaminski@cs.uni-potsdam.de" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["clingo>=5.8,<5.9", "cffi"]

[project.scripts]
pyclingodl = "clingodl.__main__:main"

[project.urls]
Homepage = "https://github.com/potassco/clingo-dl"

[[tool.dynamic-metadata]]
provider = { path = "scripts", module = "meta" }

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.args = [
    '-DCLINGODL_MANAGE_RPATH=OFF',
    '-DPYCLINGODL_ENABLE=pip',
    '-DPYCLINGODL_INSTALL_DIR=.',
]

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} -v --exclude \"_clingo*.pyd\" {wheel}"
