{% set name = 'clingo-dl' %}
{% set version = environ.get('VERSION_NUMBER', '1.0.0') %}
{% set build = environ.get('BUILD_NUMBER', '0') %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../..

requirements:
  build:
  - cmake
  - ninja
  - re2c
  - python
  - pytest
  - {{ compiler('c') }}
  - {{ compiler('cxx') }}
  host:
  - clingo
  - python
  run:
  - python
  - clingo

build:
  number: {{ build }}

test:
  commands:
  - clingo-dl --version
  - python -c "import clingodl; clingodl._pyclingodl()" --version

about:
  home: https://potassco.org/
  license: MIT
  summary: A solver for logic programs with difference constraints.
  description: >-
    Clingo-dl is an extension of the clingo answer set programming solver that
    combines logical rules with difference constraints over integers or reals.
    This makes it useful for problems where choices and timing or numeric
    relationships need to be reasoned about together, such as scheduling and
    timetabling. Its focused constraint language can make these relationships
    easier to express within an ASP model.
  license_file: LICENSE.md
  doc_url: https://potassco.org/
  dev_url: https://github.com/potassco/{{ name }}/
