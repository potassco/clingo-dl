[version]
header_path = ../libclingo-dl/clingo-dl.h
macro_field = CLINGODL_VERSION

[conda]
name = clingo-dl
owner = potassco

[ppa]
name = clingo-dl
key = 744d959e10f5ad73f9cf17cc1d150536980033d5
add_ppa = yes
extra_depends = dh-python
exclude = __pycache__
    .mypy_cache
    *,cover
    *.egg-info
    dist
    build
    third_party/catch
include = ../../app
    ../../CHANGES.md
    ../../cmake
    ../../CMakeLists.txt
    ../../INSTALL.md
    ../../lib*
    ../../LICENSE.md
    ../../README.md
    ../../scripts
    ../../third_party
